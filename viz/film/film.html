<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
</div>
<div id="big"><button id="playbtn">▶ &nbsp;PLAY THE FILM &nbsp;<span style="color:#9a9aa2">— with sound</span></button></div>
<div id="hint">real MuQ-MuLan embeddings of a personal library · sound is real audio from the tracks</div>
<div id="ui" class="hide">
  <button id="rp">↺ REPLAY</button>
  <button id="mute">◼ MUTE</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="tc">0:00 / 0:00</div>
</div>

<script>
"use strict";
/* ============================================================================
   THE SHAPE OF A MUSIC LIBRARY  —  a motion-graphics film over real MuQ-MuLan
   embeddings.  Frame-driven deterministic clock (capturable), seeded RNG.
   Direction: "star-atlas plate in motion" (see DIRECTION.md).
============================================================================ */

/* ---------- deterministic RNG (mulberry32) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd = mulberry32(20093);
Math.random = rnd;                     // nothing may use wall-clock randomness

/* ---------- easing ---------- */
const clamp01=t=>t<0?0:t>1?1:t;
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  linear:t=>t,
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outCubic:t=>1-Math.pow(1-t,3),
  outQuart:t=>1-Math.pow(1-t,4),
  outQuint:t=>1-Math.pow(1-t,5),
  inOutQuart:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  outBack:(t,s=1.9)=>{const c3=s+1,p=t-1;return 1+c3*p*p*p+s*p*p;},
  inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2,
};
const smooth=(a,b,t)=>clamp01((t-a)/(b-a));

/* ---------- canvas / geometry ---------- */
const CV=document.getElementById('c'), G=CV.getContext('2d',{alpha:false});
const W=1920,H=1080, CX=W/2, CY=H/2;
const WORLDR=560;                       // galaxy radius in world units at zoom 1

/* palette (star-atlas plate) */
const PAL={
  ink:'#0a0b0f', plate:'#0c0e13', frame:'#20242e',
  paper:'#eceae2', mut:'#7d818c', faint:'#4a4e59',
  ikb:'#4b74ff',                        // international klein blue (query beam / active)
  red:'#e6382a',                        // signal red (now-playing / comet)
  white:'#f4f2ea',
};

/* ---------- data ---------- */
let D=null, N=0;
let ix,iy, gi, zdep, phA,phB, scx,scy, twk;    // per-particle arrays
let GEN=[], GENc=[], gcen=[], gcount=[];
let funk={x:0,y:0}, pathW=[], moods=[], heroes=[], heroById={}, genreHero={}, labels={};
let sprites={};                                 // color -> soft glow sprite

const DUR=99.0;                                 // total seconds
/* scene markers (s) */
const T={hook:0, build:7, reveal:17, zoom:39.5, mood:52, path:71, payoff:89, end:DUR};

async function loadData(){
  D = window.__FILM_DATA__ || await (await fetch('film_data.json')).json();
  N = D.n;
  GEN = D.genres.map(g=>g.name);
  GENc = D.genres.map(g=>g.color);
  const tx=D.tx, ty=D.ty;
  ix=new Float32Array(N); iy=new Float32Array(N);
  gi=new Uint8Array(D.g); zdep=new Float32Array(N);
  phA=new Float32Array(N); phB=new Float32Array(N); twk=new Float32Array(N);
  scx=new Float32Array(N); scy=new Float32Array(N);
  for(let i=0;i<N;i++){
    ix[i]=tx[i]*WORLDR; iy[i]=ty[i]*WORLDR;
    zdep[i]=rnd();                                   // depth 0(far)..1(near)
    phA[i]=rnd()*Math.PI*2; phB[i]=rnd()*Math.PI*2; twk[i]=rnd()*Math.PI*2;
    const a=rnd()*Math.PI*2, r=8+rnd()*44;           // tight luminous SEED at centre
    scx[i]=Math.cos(a)*r; scy[i]=Math.sin(a)*r;
  }
  // genre centroids + counts (island world)
  const sx=new Float64Array(GEN.length),sy=new Float64Array(GEN.length),cc=new Float64Array(GEN.length);
  for(let i=0;i<N;i++){const g=gi[i];sx[g]+=ix[i];sy[g]+=iy[i];cc[g]++;}
  gcen=GEN.map((_,g)=>({x:cc[g]?sx[g]/cc[g]:0,y:cc[g]?sy[g]/cc[g]:0}));
  gcount=Array.from(cc);
  const ff=GEN.indexOf('future funk'), cp=GEN.indexOf('city pop');
  funk={x:(gcen[ff].x+gcen[cp].x)/2,y:(gcen[ff].y+gcen[cp].y)/2};
  pathW=D.path.map(s=>({s,x:ix[s],y:iy[s]}));
  moods=D.moods.map(m=>({...m, wx:m.x*WORLDR, wy:m.y*WORLDR}));
  labels=D.labels;
  heroes=D.heroes;
  heroes.forEach(h=>{ heroById[h.id]=h;
    if(!(h.genre in genreHero)) genreHero[h.genre]=h; });
  buildSprites();
  buildAudioCues();
}

/* soft additive glow sprite per color (+bright core) */
function makeSprite(hex){
  const S=64, o=document.createElement('canvas'); o.width=o.height=S;
  const x=o.getContext('2d'), c=S/2;
  const g=x.createRadialGradient(c,c,0,c,c,c);
  g.addColorStop(0,hexA(hex,1)); g.addColorStop(.18,hexA(hex,.85));
  g.addColorStop(.5,hexA(hex,.18)); g.addColorStop(1,hexA(hex,0));
  x.fillStyle=g; x.beginPath(); x.arc(c,c,c,0,7); x.fill();
  return o;
}
function buildSprites(){
  sprites={};
  [...GENc, PAL.white, PAL.ikb, PAL.red].forEach(h=>sprites[h]=makeSprite(h));
}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

/* ---------- virtual camera (log-zoom keyframes) ---------- */
let KF=[];
function buildCam(){
  const pm=pathW[Math.floor(pathW.length*0.4)], pe=pathW[pathW.length-2];
  KF=[
    {t:0,     x:0,y:0,z:1.55},
    {t:T.build, x:0,y:0,z:1.02},
    {t:T.reveal,x:0,y:0,z:1.0},
    {t:33,    x:0,y:0,z:1.14},
    {t:T.zoom,x:funk.x,y:funk.y,z:2.75},
    {t:51,    x:funk.x,y:funk.y,z:2.75},
    {t:T.mood,x:0,y:0,z:1.2},
    {t:70,    x:0,y:0,z:1.2},
    {t:T.path,x:pm.x,y:pm.y,z:1.75},
    {t:88,    x:pe.x,y:pe.y,z:1.7},
    {t:T.payoff,x:0,y:0,z:0.82},
    {t:DUR,   x:0,y:0,z:0.9},
  ];
}
function camAt(t){
  let a=KF[0],b=KF[KF.length-1];
  for(let i=0;i<KF.length-1;i++){ if(t>=KF[i].t&&t<=KF[i+1].t){a=KF[i];b=KF[i+1];break;} }
  const p=E.inOutCubic(smooth(a.t,b.t,t));
  const z=a.z*Math.pow(b.z/a.z,p);                   // log-space zoom
  const bx=Math.sin(t*0.31)*3.5, by=Math.cos(t*0.24)*3.0;  // camera breath
  return {x:lerp(a.x,b.x,p)+bx, y:lerp(a.y,b.y,p)+by, z:z*(1+Math.sin(t*0.4)*0.004)};
}
let cam={x:0,y:0,z:1};
const proj=(wx,wy,depth=1)=>{ const dz=0.94+0.12*depth;   // parallax by depth
  return [CX+(wx-cam.x)*cam.z*dz, CY+(wy-cam.y)*cam.z*dz]; };

/* ---------- per-particle live position ---------- */
function flyDelay(i){                 // far-from-centre leave first, arrive together
  const d=Math.hypot(ix[i],iy[i]); return (1-d/(WORLDR*1.2))*2.4;
}
function churnAmp(t){
  if(t<T.build) return 0;
  const up=smooth(T.build,T.build+2.5,t)*58;
  const down=1-smooth(20,33,t);
  return Math.max(6, up*down);          // settles to gentle idle 6
}
function ppos(i,t){
  const fly=E.inOutQuart(clamp01((t-T.build-flyDelay(i))/3.0));
  let x=lerp(scx[i],ix[i],fly), y=lerp(scy[i],iy[i],fly);
  // curved flight (perpendicular arc, peaks mid)
  const dx=ix[i]-scx[i],dy=iy[i]-scy[i], L=Math.hypot(dx,dy)||1;
  const arc=Math.sin(fly*Math.PI)*(twk[i]*40-20);
  x+=-dy/L*arc; y+=dx/L*arc;
  // churn + idle drift
  const a=churnAmp(t)*(0.6+0.4*zdep[i]);
  x+=Math.sin(t*0.6+phA[i])*a + Math.sin(t*0.23+phB[i])*a*0.5;
  y+=Math.cos(t*0.53+phB[i])*a + Math.cos(t*0.19+phA[i])*a*0.5;
  return [x,y];
}
/* particle appearance state */
function pAlpha(i,t){ return clamp01((t-T.build-flyDelay(i))/0.6); }
function igniteT(g){                    // colours ignite big-genres-first across reveal
  const order=[...GEN.keys()].sort((a,b)=>gcount[b]-gcount[a]);
  const rank=order.indexOf(g);
  return T.reveal+2.0 + rank*1.35;
}
function pColorProg(i,t){ return clamp01((t-igniteT(gi[i]))/1.6); }

/* ============================================================================
   DRAW
============================================================================ */
function bgFade(t){
  // trail length varies by scene: trails during motion, crisper when reading
  let a=0.30;
  if(t<T.reveal) a=0.16;
  else if(t<33) a=0.20;
  else if(t>=T.path&&t<T.payoff) a=0.24;
  G.globalCompositeOperation='source-over';
  G.fillStyle=hexA(PAL.plate,a); G.fillRect(0,0,W,H);
}
function drawField(t){
  // far bokeh dust (parallax, very soft)
  G.globalCompositeOperation='lighter';
  for(let k=0;k<26;k++){
    const ph=k*2.399, dpt=0.05+0.12*((k*97)%100)/100;
    const wx=Math.cos(ph+t*0.03)*WORLDR*1.5, wy=Math.sin(ph*1.7+t*0.025)*WORLDR*1.1;
    const [sx,sy]=proj(wx,wy,dpt); const r=(70+((k*53)%60))*cam.z*0.5;
    G.globalAlpha=0.05; G.drawImage(sprites[PAL.white], sx-r,sy-r,r*2,r*2);
  }
  // particles — additive halo pass
  const twP=0.5+0.5;
  for(let i=0;i<N;i++){
    const al=pAlpha(i,t); if(al<=0.001) continue;
    const [wx,wy]=ppos(i,t); const [sx,sy]=proj(wx,wy,zdep[i]);
    if(sx<-40||sx>W+40||sy<-40||sy>H+40) continue;
    const cp=pColorProg(i,t);
    const spr = cp>0.5 ? sprites[GENc[gi[i]]] : sprites[PAL.white];
    const tw=0.82+0.18*Math.sin(t*1.7+twk[i]*6.2);
    const bright=(0.34+0.66*zdep[i])*al*tw*(cp>0.5?1:0.7);
    const r=(3.0+5.5*zdep[i])*cam.z*(cp>0.5?1:0.9);
    G.globalAlpha=Math.min(1,bright);
    G.drawImage(spr, sx-r, sy-r, r*2, r*2);
  }
  // crisp cores (print-plate bite) — only near particles, cheap subset
  G.globalCompositeOperation='source-over';
  for(let i=0;i<N;i++){
    if(zdep[i]<0.62) continue;
    const al=pAlpha(i,t); if(al<=0.02) continue;
    const [wx,wy]=ppos(i,t); const [sx,sy]=proj(wx,wy,zdep[i]);
    if(sx<0||sx>W||sy<0||sy>H) continue;
    const cp=pColorProg(i,t);
    G.globalAlpha=al*0.5*(0.4+0.6*zdep[i]);
    G.fillStyle=cp>0.5?GENc[gi[i]]:PAL.paper;
    const s=Math.max(0.7,1.05*cam.z*zdep[i]);
    G.fillRect(sx-s/2,sy-s/2,s,s);
  }
  G.globalAlpha=1;
}

/* ---- typography helpers ---- */
function slug(text,x,y,size,prog,{align='left',color=PAL.paper,rise=22,track=0}={}){
  if(prog<=0) return;
  const e=E.outExpo(clamp01(prog));
  G.save();
  G.font=`${size}px 'Archivo Black',sans-serif`;
  G.textAlign=align; G.textBaseline='alphabetic';
  if(track) G.letterSpacing=`${(-size*0.04*(1-e)).toFixed(2)}px`;
  // clip-up reveal
  const m=G.measureText(text); const asc=size*1.0, w=m.width;
  let clx = align==='center'? x-w/2 : align==='right'? x-w : x;
  G.beginPath(); G.rect(clx-6, y-asc*e-4, w+12, asc*e+size*0.35); G.clip();
  G.globalAlpha=e; G.fillStyle=color;
  G.shadowColor='rgba(4,5,8,0.72)'; G.shadowBlur=size*0.32; G.shadowOffsetY=2;
  G.fillText(text, x, y - (1-e)*rise*0.35);
  G.restore(); G.globalAlpha=1;
}
function mono(text,x,y,size,alpha,{align='left',color=PAL.mut,ls=0.5,halo=false}={}){
  G.save(); G.font=`${size}px ui-monospace,Consolas,monospace`;
  G.textAlign=align; G.textBaseline='alphabetic'; G.letterSpacing=`${ls}px`;
  if(halo){ G.shadowColor='rgba(4,5,8,0.9)'; G.shadowBlur=6; }
  G.globalAlpha=alpha; G.fillStyle=color; G.fillText(text,x,y); G.restore(); G.globalAlpha=1;
}
function posterHalo(size){ G.shadowColor='rgba(4,5,8,0.85)'; G.shadowBlur=size*0.5; G.shadowOffsetY=1; }
function typeOn(text,at,cps,t){        // typewriter substring
  const n=Math.floor(clamp01((t-at)*cps)); return text.slice(0,Math.min(text.length,Math.max(0,n)));
}

/* rounded art thumbnail */
const imgCache={};
function img(src){ if(!src) return null; if(imgCache[src]) return imgCache[src];
  const im=new Image(); im.src=src; imgCache[src]=im; return im; }
function drawArt(src,cx,cy,size,alpha,{ring=null}={}){
  const im=img(src); if(!im||!im.complete||!im.width){
    G.globalAlpha=alpha*0.5; G.fillStyle='#1a1d25'; G.fillRect(cx-size/2,cy-size/2,size,size); G.globalAlpha=1; return; }
  G.save(); G.globalAlpha=alpha;
  G.beginPath(); const r=size*0.08; roundRect(cx-size/2,cy-size/2,size,size,r); G.clip();
  G.drawImage(im,cx-size/2,cy-size/2,size,size); G.restore();
  if(ring){ G.save(); G.globalAlpha=alpha; G.strokeStyle=ring; G.lineWidth=2.2;
    roundRect(cx-size/2,cy-size/2,size,size,r); G.stroke(); G.restore(); }
  G.globalAlpha=1;
}
function roundRect(x,y,w,h,r){ G.beginPath();
  G.moveTo(x+r,y);G.arcTo(x+w,y,x+w,y+h,r);G.arcTo(x+w,y+h,x,y+h,r);
  G.arcTo(x,y+h,x,y,r);G.arcTo(x,y,x+w,y,r);G.closePath(); }
function artFor(s){ return (D.arts&&D.arts[s])|| (heroById[s]&&heroById[s].art) || null; }
function scrim(y0,y1,a,top){ // soft dark band so text reads over clusters
  const g=G.createLinearGradient(0,y0,0,y1);
  const c0=top?`rgba(6,7,10,${a})`:'rgba(6,7,10,0)', c1=top?'rgba(6,7,10,0)':`rgba(6,7,10,${a})`;
  g.addColorStop(0,c0); g.addColorStop(1,c1);

}

function makeGrain(){ const s=160,o=document.createElement('canvas');o.width=o.height=s;

let pathArtImg=null;
function actPath(t){
  scrim(0,210,0.62,true);

  mono('autoplay walks the space by sound-similarity — staying in the mood, drifting gently',
       CX,166,15,smooth(T.path+1.4,T.path+2.6,t)*0.9,{align:'center',color:PAL.mut,ls:1});
  const startAt=T.path+2.2, per=3.5;                    // seconds per hop
  const prog=(t-startAt)/per;
  const nSeg=pathW.length-1;
  // draw traversed polyline
  G.globalCompositeOperation='source-over';
  G.strokeStyle=hexA(PAL.red,0.5); G.lineWidth=1.8; G.beginPath();
  let started=false, headS=0, headX=0,headY=0, curIdx=0;
  for(let k=0;k<nSeg;k++){
    const segP=clamp01(prog-k); if(segP<=0) break;
    const a=pathW[k],b=pathW[k+1];
    const [ax,ay]=proj(a.x,a.y,1),[bx,by]=proj(b.x,b.y,1);
    const e=E.inOutCubic(segP);
    const hx=lerp(ax,bx,e),hy=lerp(ay,by,e);
    if(!started){G.moveTo(ax,ay);started=true;}
    G.lineTo(hx,hy); headX=hx;headY=hy; curIdx = segP<1? k : k+1;
  }
  if(started) G.stroke();
  // node dots
  for(let k=0;k<pathW.length;k++){
    if(prog<k-0.02) break;
    const [px,py]=proj(pathW[k].x,pathW[k].y,1);
    G.globalCompositeOperation='lighter'; G.globalAlpha=0.9;
    const r=k===0?16:11; G.drawImage(sprites[PAL.red],px-r,py-r,r*2,r*2);
    G.globalCompositeOperation='source-over'; G.globalAlpha=1;
  }
  // comet head
  if(started){
    G.globalCompositeOperation='lighter'; G.globalAlpha=1;
    G.drawImage(sprites[PAL.red],headX-22,headY-22,44,44);
    G.globalCompositeOperation='source-over'; G.globalAlpha=1;
  }
  // lower-third: current track
  const cur=pathW[Math.min(curIdx,pathW.length-1)];
  const lab=labels[cur.s];
  const a3=smooth(startAt,startAt+0.6,t);
  if(lab){
    const bx=90,by=H-176,bw=500;
    G.globalAlpha=a3*0.92; G.fillStyle='rgba(9,10,14,0.8)'; roundRect(bx,by,bw,104,5); G.fill();
    G.strokeStyle=hexA(PAL.red,0.35); G.lineWidth=1; roundRect(bx,by,bw,104,5); G.stroke(); G.globalAlpha=1;
    drawArt(artFor(cur.s),bx+58,by+52,76,a3,{ring:hexA(PAL.red,0.95)});
    mono('NOW PLAYING · autoplay',bx+112,by+30,12,a3*0.85,{color:PAL.red,ls:2});
    G.save(); G.font=`21px 'Archivo Black',sans-serif`; G.globalAlpha=a3; G.fillStyle=PAL.paper;
    G.fillText(fit(lab[1],26),bx+112,by+60); G.restore(); G.globalAlpha=1;
    mono(lab[0],bx+112,by+82,13,a3*0.9,{color:PAL.mut});
    mono('#'+(Math.min(curIdx,pathW.length-1)+1)+' / '+pathW.length,bx+bw-18,by+30,12,a3*0.7,{align:'right',color:PAL.mut});
  }
}
function fit(s,n){ return s.length>n? s.slice(0,n-1)+'…':s; }

function actPayoff(t){
  // faint genre labels over the whole galaxy (skip any that fall near the title block)
  const la=smooth(T.payoff+1.5,T.payoff+3.5,t);
  const order=[...GEN.keys()].sort((a,b)=>gcount[b]-gcount[a]);
  for(const g of order){ if(gcount[g]<80) continue;
    const [sx,sy]=proj(gcen[g].x,gcen[g].y,1);
    if(Math.abs(sy-CY)<150 && Math.abs(sx-CX)<560) continue;
    mono(GEN[g].toUpperCase(),sx,sy,13,la*0.55,{align:'center',color:hexA(GENc[g],1),ls:1,halo:true});
  }
  // radial scrim behind the closing title
  const ta=smooth(T.payoff+2.0,T.payoff+3.0,t);
  const rg=G.createRadialGradient(CX,CY+30,60,CX,CY+30,620);
  rg.addColorStop(0,`rgba(6,7,10,${0.82*ta})`); rg.addColorStop(1,'rgba(6,7,10,0)');
  G.fillStyle=rg; G.fillRect(0,CY-260,W,560);
  slug(N.toLocaleString()+' songs. One space.',CX,CY-24,72,smooth(T.payoff+2.2,T.payoff+3.4,t),
       {align:'center'});
  slug('A library you can wander by feel.',CX,CY+58,40,smooth(T.payoff+3.4,T.payoff+4.4,t),
       {align:'center',color:PAL.ikb});
  mono('BUILT WITH MuQ-MuLan · t-SNE OF REAL AUDIO EMBEDDINGS',CX,CY+120,14,
       smooth(T.payoff+4.6,T.payoff+5.6,t)*0.85,{align:'center',color:PAL.mut,ls:2,halo:true});
}

/* ============================================================================
   MASTER FRAME
============================================================================ */
function drawFrame(t){
  t=Math.max(0,Math.min(DUR,t));
  cam=camAt(t);
  bgFade(t);
  drawField(t);
  // scene overlays
  if(t<T.build) actHook(t);
  if(t>=T.build && t<T.reveal) actBuild(t);
  if(t>=T.reveal && t<T.zoom) actReveal(t);
  if(t>=T.zoom && t<T.mood) actZoom(t);
  if(t>=T.mood && t<T.path) actMood(t);
  if(t>=T.path && t<T.payoff) actPath(t);
  if(t>=T.payoff) actPayoff(t);
  overlayPlate(t);
}

/* ============================================================================
   AUDIO (WebAudio) — real clips scheduled to the timeline
============================================================================ */
let AC=null, MASTER=null, buffers={}, CUES=[], muted=false, audioStarted=false;
function buildAudioCues(){
  // pick a hero clip per genre for the reveal montage, plus mood/zoom/path features
  const g=(name)=>genreHero[name];
  const clip=(h,at,dur,gain=0.9)=>{ if(h&&h.clip) CUES.push({id:h.id,at,dur,gain}); };
  CUES=[];
  clip(heroes[0], T.hook+1.6, 5.0, 0.7);                       // hook — one point, one sound
  // reveal montage: quick genre stabs as each big genre ignites
  const order=[...GEN.keys()].sort((a,b)=>gcount[b]-gcount[a]);
  for(const gg of order.slice(0,5)){ const h=g(GEN[gg]); if(h){ clip(h, igniteT(gg)+0.5, 2.4, 0.62);} }
  // zoom hero (fuller)
  const zh=heroes.find(h=>['future funk','city pop'].includes(h.genre)); clip(zh,T.zoom+2.4,7.5,0.95);
  // mood top matches (one per query, timed to the results panel)
  moods.slice(0,2).forEach((md,i)=>{ const h=heroes.find(hh=>hh.s===md.matches[0]);
    clip(h, T.mood+2.2+i*8.2+4.2, 4.6, 0.95); });
  // path — genre heroes across the walk (guaranteed clips), non-overlapping
  [g('chiptune'),g('orchestral VGM'),g('future funk')].forEach((h,i)=>{
    clip(h, T.path+3.0+i*5.2, 5.0, 0.85); });
  // payoff resolve
  clip(heroes[Math.min(3,heroes.length-1)], T.payoff+1.5, 7.0, 0.8);
  window.AUDIO_CUES=CUES;
}
async function initAudio(){
  if(audioStarted) return; audioStarted=true;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  MASTER=AC.createGain(); MASTER.gain.value=muted?0:1; MASTER.connect(AC.destination);
  // decode unique clips
  const uniq=[...new Set(CUES.map(c=>c.id))];
  await Promise.all(uniq.map(async id=>{
    const h=heroById[id]; if(!h||!h.clip) return;
    try{ const ab=await (await fetch(h.clip)).arrayBuffer();
         buffers[id]=await AC.decodeAudioData(ab); }catch(e){}
  }));
}
function scheduleAudio(fromT){
  if(!AC) return;
  const now=AC.currentTime;
  CUES.forEach(c=>{
    const b=buffers[c.id]; if(!b) return;
    const when=now+(c.at-fromT);
    if(c.at+c.dur < fromT) return;             // already past
    const start=Math.max(now,when);
    const src=AC.createBufferSource(); src.buffer=b;
    const g=AC.createGain(); src.connect(g); g.connect(MASTER);
    const off=Math.max(0, fromT-c.at);
    const d=Math.min(c.dur, b.duration-off);
    g.gain.setValueAtTime(0,start);
    g.gain.linearRampToValueAtTime(c.gain, start+0.4);
    g.gain.setValueAtTime(c.gain, start+Math.max(0.5,d-0.6));
    g.gain.linearRampToValueAtTime(0, start+d);
    try{ src.start(start, off, d+0.05); }catch(e){}
    playing.push(src);
  });
}
let playing=[];
function stopAudio(){ playing.forEach(s=>{try{s.stop()}catch(e){}}); playing=[]; }

/* ============================================================================
   PLAYBACK LOOP + CAPTURE HOOKS
============================================================================ */
let masterT=0, last=0, running=false;
function tick(ts){
  if(!running) return;
  if(!last) last=ts;
  const dt=Math.min(0.05,(ts-last)/1000); last=ts; masterT+=dt;
  if(masterT>=DUR){ masterT=DUR; drawFrame(masterT); running=false; showEnd(); return; }
  drawFrame(masterT);
  updateUI();
  requestAnimationFrame(tick);
}
function play(){ if(running) return;
  if(masterT>=DUR) masterT=0;
  running=true; last=0;
  initAudio().then(()=>{ stopAudio(); scheduleAudio(masterT); });
  requestAnimationFrame(tick);
  document.getElementById('big').classList.add('gone');
  document.getElementById('ui').classList.remove('hide');
}
function pause(){ running=false; stopAudio(); }
function replay(){ pause(); masterT=0; play(); }
function showEnd(){ updateUI(); }

/* transport UI */
const fillEl=document.getElementById('fill'), tcEl=document.getElementById('tc');
function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0');}
function updateUI(){ fillEl.style.width=(masterT/DUR*100)+'%'; tcEl.textContent=fmt(masterT)+' / '+fmt(DUR); }
document.getElementById('bar').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect(); masterT=clamp01((e.clientX-r.left)/r.width)*DUR;
  stopAudio(); if(running){scheduleAudio(masterT);} drawFrame(masterT); updateUI();
});
document.getElementById('rp').onclick=replay;
document.getElementById('mute').onclick=e=>{ muted=!muted; if(MASTER)MASTER.gain.value=muted?0:1;
  e.target.textContent=muted?'◻ UNMUTE':'◼ MUTE'; };
document.getElementById('playbtn').onclick=play;
document.getElementById('big').onclick=e=>{ if(e.target.id!=='playbtn') play(); };
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); running?pause():play();}
  if(e.key==='r')replay(); });

/* capture hooks (frame-driven, deterministic) */
window.__filmDuration=DUR;
window.__cap=function(t){ drawFrame(t); };     // render single frame at absolute seconds
window.__clear=function(){ G.globalCompositeOperation='source-over'; G.fillStyle=PAL.plate; G.fillRect(0,0,W,H); };
window.__ready=false;

function preloadImages(){
  const srcs=new Set();
  heroes.forEach(h=>{ if(h.art) srcs.add(h.art); });
  if(D.arts) Object.values(D.arts).forEach(s=>srcs.add(s));
  return Promise.all([...srcs].map(src=>new Promise(res=>{
    const im=img(src); if(im&&im.complete) return res();
    if(!im) return res(); im.onload=()=>res(); im.onerror=()=>res();
  })));
}
/* boot */
(async function boot(){
  makeGrain();
  await loadData();
  buildCam();
  try{ if(document.fonts){ await Promise.all([
        document.fonts.load("400 100px 'Archivo Black'"),
        document.fonts.load("400 40px 'Archivo Black'")]);
      await document.fonts.ready; } }catch(e){}
  await preloadImages();
  drawFrame(0);
  window.__ready=true;
  // capture mode?
  const q=new URLSearchParams(location.search);
  if(q.get('capture')==='1'){ document.getElementById('big').classList.add('gone');
    document.getElementById('ui').classList.add('hide'); document.getElementById('hint').style.display='none'; }
})();
</script>
